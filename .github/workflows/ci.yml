name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint + Build + TypeCheck + Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: Affected Tests (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/affected-test.mjs --base origin/${{ github.base_ref }}

      - name: Unit Tests (Push)
        if: github.event_name == 'push'
        run: pnpm test

      - name: Build Demo
        run: pnpm --filter @3dgs/demo build

      - name: Build Docs
        run: pnpm --filter @3dgs/docs build

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start Demo server
        run: |
          pnpm --filter @3dgs/demo dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Demo server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Demo server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Run benchmark
        # ★ R-07: --gate 门禁 — 任一场景 P50 < 30fps 时 CI 失败
        run: npx tsx benchmarks/benchmark.ts --gate

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/reports/
          retention-days: 30
