name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint + Build + TypeCheck + Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: AGENTS.md refs check
        # ★ agents-crossref-no-automated-check: root AGENTS.md Internal Markers
        #   段的 D-xx/R-xx 文档引用必须有确定性检查, 断链 (文件改名/移动)
        #   会导致标记契约静默失效 — 纯 node 脚本, 无浏览器依赖
        run: node scripts/check-agents-refs.mjs

      - name: Agent asset inventory check
        # ★ agent-asset-inventory-gap: 资产盘点遗漏嵌套 AGENTS.md 与
        #   .husky/pre-commit hook — 规则与门禁资产必须进入确定性扫描,
        #   双向核对根段引用与文件系统, 断言 rules=5 / hooks=1
        run: node scripts/check-agent-assets.mjs

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: Affected Tests (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/affected-test.mjs --base origin/${{ github.base_ref }}

      - name: Unit Tests (Push)
        if: github.event_name == 'push'
        # ★ R-14: coverage 阈值门禁 — 全量测试 + v8 覆盖率阈值 (见 vitest.config.ts),
        #   防 renderer-three/convert 覆盖率实质退化不被感知
        run: pnpm test:coverage

      - name: Build Demo
        run: pnpm --filter @3dgs/demo build

      - name: Build Docs
        run: pnpm --filter @3dgs/docs build

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        # ★ R-13: benchmark 与根 engines (>=22) / build-and-test 矩阵 (22,24) 保持一致的 Node 版本 —
        #   原 20 为无意选择（无记录理由），统一到 22，避免本地 (>=22) 与基准结果 V8/Playwright 行为差异
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start Demo server
        run: |
          pnpm --filter @3dgs/demo dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Demo server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Demo server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Run render smoke E2E
        # ★ R-14: renderer 主路径 browser 级行为证据 — 真实 Chromium 加载 demo
        #   场景, 断言 canvas 挂载 + 首帧像素非空 + 无控制台错误
        #   (复用本 job 已起的 demo server 与已安装的 playwright chromium)
        run: npx tsx e2e/render-smoke.ts

      - name: Run benchmark
        # ★ R-07: --gate 门禁 — 任一场景 P50 < 30fps 时 CI 失败
        run: npx tsx benchmarks/benchmark.ts --gate

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/reports/
          retention-days: 30
