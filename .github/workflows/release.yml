name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (仅生成版本 PR, 不发布到 npm)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # ★ 必须用 pnpm 前缀, 否则 action 找不到 changeset 可执行文件
          #   (pnm 将二进制安装到 node_modules/.bin/, 不在 action 的默认 PATH 中)
          # version: pnpm changeset version (处理 changeset → 生成版本 PR)
          # dry_run=true  → publish 设为 'true' (no-op, 仅生成版本 PR)
          # dry_run=false → publish 设为 'pnpm changeset publish' (发布到 npm)
          version: pnpm changeset version
          publish: ${{ inputs.dry_run == true && 'true' || 'pnpm changeset publish' }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Published**: ${{ steps.changesets.outputs.published }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Has Changesets**: ${{ steps.changesets.outputs.hasChangesets }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pull Request Number**: ${{ steps.changesets.outputs.pullRequestNumber }}" >> $GITHUB_STEP_SUMMARY
