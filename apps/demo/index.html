<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3DGS Tour Player Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
#viewer { width: 100%; height: 100%; position: relative; }
#info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 8px; font-size: 14px; pointer-events: none; text-align: center; max-width: 80%; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
#loading .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
#error { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(200,40,40,0.9); padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; }
#hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 12px; font-family: monospace; line-height: 1.6; pointer-events: none; display: none; }

/* 右侧面板容器 — flex 布局避免重叠 */
#right-panel { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; z-index: 10; max-width: 220px; }

/* 场景选择器 */
#scene-selector { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
#scene-selector button { background: rgba(0,0,0,0.6); color: #eee; border: 1px solid rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
#scene-selector button:hover { background: rgba(255,255,255,0.15); }
#scene-selector button.active { background: rgba(80,160,255,0.4); border-color: rgba(80,160,255,0.8); }

/* 数据格式切换面板 */
#format-panel { background: rgba(10,12,18,0.82); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; min-width: 160px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
#format-panel .format-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#format-panel .format-panel-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: 0.3px; }
#format-toggles { display: flex; flex-direction: column; gap: 4px; }
.format-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; user-select: none; }
.format-toggle-row:hover { background: rgba(255,255,255,0.06); }
.format-toggle-row .format-label { color: rgba(255,255,255,0.75); font-size: 12px; transition: color 0.2s; }
.format-toggle-row.active .format-label { color: rgba(255,255,255,0.95); }
.format-toggle-row .format-size { color: rgba(255,255,255,0.4); font-size: 10px; font-family: monospace; }
.format-toggle-switch { position: relative; width: 34px; height: 18px; background: rgba(255,255,255,0.15); border-radius: 9px; transition: background 0.25s ease; flex-shrink: 0; }
.format-toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: rgba(255,255,255,0.7); border-radius: 50%; transition: transform 0.25s ease, background 0.25s ease; }
.format-toggle-row.active .format-toggle-switch { background: rgba(86,156,214,0.6); }
.format-toggle-row.active .format-toggle-switch::after { transform: translateX(16px); background: #fff; }

/* Shader 效果面板 */
#shader-panel { background: rgba(10,12,18,0.82); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; font-size: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; min-width: 180px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
#shader-panel .shader-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#shader-panel .shader-panel-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: 0.3px; }
#shader-panel .shader-clear-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); font-size: 11px; padding: 2px 10px; border-radius: 5px; cursor: pointer; transition: all 0.2s; line-height: 1.4; }
#shader-panel .shader-clear-btn:hover { background: rgba(255,80,80,0.2); border-color: rgba(255,80,80,0.4); color: rgba(255,160,160,0.95); }
#shader-panel .shader-clear-btn:disabled { opacity: 0.35; cursor: not-allowed; }
#shader-panel .shader-clear-btn:disabled:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); }
#shader-toggles { display: flex; flex-direction: column; gap: 4px; }
.shader-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; user-select: none; }
.shader-toggle-row:hover { background: rgba(255,255,255,0.06); }
.shader-toggle-row .shader-label { color: rgba(255,255,255,0.75); font-size: 12px; transition: color 0.2s; }
.shader-toggle-row.active .shader-label { color: rgba(255,255,255,0.95); }
.shader-toggle-switch { position: relative; width: 34px; height: 18px; background: rgba(255,255,255,0.15); border-radius: 9px; transition: background 0.25s ease; flex-shrink: 0; }
.shader-toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: rgba(255,255,255,0.7); border-radius: 50%; transition: transform 0.25s ease, background 0.25s ease; }
.shader-toggle-row.active .shader-toggle-switch { background: rgba(86,156,214,0.6); }
.shader-toggle-row.active .shader-toggle-switch::after { transform: translateX(16px); background: #fff; }

/* 操作说明面板 */
#controls-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 18px; font-size: 12px; line-height: 1.8; pointer-events: none; backdrop-filter: blur(6px); max-width: 260px; }
#controls-panel .panel-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.9); }
#controls-panel .ctrl-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
#controls-panel .ctrl-keys { display: flex; gap: 3px; }
#controls-panel kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-bottom-width: 2px; border-radius: 4px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.8); transition: all 0.1s; }
#controls-panel kbd.active { background: rgba(80,160,255,0.5); border-color: rgba(80,160,255,0.8); color: #fff; transform: translateY(1px); }
#controls-panel .ctrl-desc { color: rgba(255,255,255,0.6); font-size: 11px; }
#controls-panel .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0; }
#controls-panel .toggle-btn { pointer-events: auto; position: absolute; top: 6px; right: 8px; background: none; border: none; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; line-height: 1; }
#controls-panel .toggle-btn:hover { color: rgba(255,255,255,0.8); }
#controls-panel.collapsed .panel-body { display: none; }
#controls-panel.collapsed { padding: 8px 14px; max-width: none; }
</style>
</head>
<body>
<div id="viewer">
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">初始化渲染器...</div>
  </div>
  <div id="hud"></div>
  <div id="right-panel">
    <div id="scene-selector"></div>
    <div id="format-panel">
      <div class="format-panel-header">
        <span class="format-panel-title">数据格式</span>
      </div>
      <div id="format-toggles"></div>
    </div>
    <div id="shader-panel">
      <div class="shader-panel-header">
        <span class="shader-panel-title">Shader 效果</span>
        <button class="shader-clear-btn" id="shader-clear-btn" disabled>清除全部</button>
      </div>
      <div id="shader-toggles"></div>
    </div>
  </div>
  <div id="controls-panel">
    <button class="toggle-btn" onclick="document.getElementById('controls-panel').classList.toggle('collapsed')" title="折叠/展开">—</button>
    <div class="panel-title">操作说明</div>
    <div class="panel-body">
      <div class="ctrl-row">
        <div class="ctrl-keys"><kbd id="key-w">W</kbd></div>
        <div class="ctrl-keys"><kbd id="key-a">A</kbd><kbd id="key-s">S</kbd><kbd id="key-d">D</kbd></div>
        <span class="ctrl-desc">水平移动</span>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-keys"><kbd id="key-q">Q</kbd><kbd id="key-e">E</kbd></div>
        <span class="ctrl-desc">升高 / 下降</span>
      </div>
      <div class="divider"></div>
      <div class="ctrl-row">
        <span class="ctrl-desc">拖拽 — 旋转视角</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-desc">滚轮 — 前进 / 后退</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-desc">双指捏合 — 缩放 (移动端)</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-desc">双指旋转 — 画面旋转 (移动端)</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-desc">双击 — 全屏切换</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-desc">点击热点 — 跳转场景</span>
      </div>
    </div>
  </div>
  <div id="error"></div>
</div>

<script type="module">
import { TourPlayer, ShaderHookPoint } from '@3dgs/core';
import { createRenderer, RenderManager } from '@3dgs/renderer-three';
import { createHotspotSystem, createDepthOcclusionPlugin, createTouchGesturesPlugin, createFullscreenPlugin, createLoadingIndicatorPlugin, createAutoRotatePlugin, createShaderInjectionPlugin } from '@3dgs/plugins';

async function main() {
  const container = document.getElementById('viewer');
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  const errorEl = document.getElementById('error');
  const hudEl = document.getElementById('hud');
  const selectorEl = document.getElementById('scene-selector');

  // ── 创建播放器 ──
  const player = new TourPlayer(container);

  // ── 创建渲染器 (WebGPU 自动检测 + WebGL2 回退) ──
  loadingText.textContent = '检测 WebGPU 支持...';
  const { renderer, backend, webgpuCapability } = await createRenderer();
  player.setRenderer(renderer);

  // ── 注册插件 ──
  player.use(createHotspotSystem());
  player.use(createDepthOcclusionPlugin({ sampleInterval: 2 }));
  player.use(createTouchGesturesPlugin());
  player.use(createFullscreenPlugin({ enableDoubleClick: true }));
  player.use(createLoadingIndicatorPlugin({ text: '加载中...', showProgress: true }));
  player.use(createAutoRotatePlugin({ speed: 8, idleDelay: 5000, enabled: false }));

  // ── 场景数据配置 ──
  // 每个场景支持 splat / spz / sog 三种数据格式
  const sceneData = {
    demo1: {
      title: '场景一',
      formats: {
        splat: { url: '/demo1.splat', size: '30.2 MB', desc: 'antimatter15/splat (32B/splat)' },
        spz: { url: '/demo1.spz', size: '14.4 MB', desc: 'Niantic SPZ (gzip 压缩)' },
        sog: { url: '/demo1.sog', size: '30.2 MB', desc: 'SOG 流式 LOD (分块)' },
      },
      splatCount: '991K',
      sourceType: 'SuperSplat 打包 PLY',
    },
    demo2: {
      title: '场景二',
      formats: {
        splat: { url: '/demo2.splat', size: '67.1 MB', desc: 'antimatter15/splat (32B/splat)' },
        spz: { url: '/demo2.spz', size: '32.4 MB', desc: 'Niantic SPZ (gzip 压缩)' },
        sog: { url: '/demo2.sog', size: '67.1 MB', desc: 'SOG 流式 LOD (分块)' },
      },
      splatCount: '2.2M',
      sourceType: '标准 3DGS PLY (SH degree 1)',
    },
    demo3: {
      title: '场景三',
      formats: {
        splat: { url: '/demo3.splat', size: '32.5 MB', desc: 'antimatter15/splat (32B/splat)' },
        spz: { url: '/demo3.spz', size: '15.0 MB', desc: 'Niantic SPZ (gzip 压缩)' },
        sog: { url: '/demo3.sog', size: '32.5 MB', desc: 'SOG 流式 LOD (分块)' },
      },
      splatCount: '1.07M',
      sourceType: '预转换 .splat 文件',
    },
    kitchen: {
      title: '场景四',
      formats: {
        splat: { url: '/kitchen.splat', size: '7.6 MB', desc: 'antimatter15/splat (32B/splat)' },
        spz: { url: '/kitchen.spz', size: '3.6 MB', desc: 'Niantic SPZ (gzip 压缩)' },
        sog: { url: '/kitchen.sog', size: '7.6 MB', desc: 'SOG 流式 LOD (分块)' },
      },
      splatCount: '248K',
      sourceType: 'Kitchen 场景 .splat 文件',
    },
  };

  let currentSceneId = 'demo1';
  let currentFormat = 'splat';
  let isSwitching = false;

  // ── 漫游配置 ──
  const config = {
    version: '1.0',
    meta: {
      title: '3DGS 多格式演示',
      description: '四场景 × 三格式 (Splat/SPZ/SOG) 数据切换演示',
    },
    defaults: {
      camera: {
        fov: 60,
        minFov: 30,
        maxFov: 90,
        limitPitch: [-80, 80],
      },
      transition: {
        type: 'fade',
        duration: 600,
      },
    },
    scenes: {
      demo1: {
        title: '场景一',
        source: '/demo1.splat',
        initialView: { yaw: 0, pitch: 0, fov: 60 },
        extensions: {
          hotspot: {
            hotspots: [
              {
                id: 'hotspot-info-1',
                type: 'text',
                position: [0.5, 1.2, -1.0],
                onHover: { tooltip: `${sceneData.demo1.splatCount} splats · ${sceneData.demo1.sourceType}` },
              },
              {
                id: 'hotspot-to-demo2',
                type: 'scene',
                position: [-1.0, 1.5, -2.0],
                targetScene: 'demo2',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#80a0ff', size: 36 },
                onHover: { tooltip: '点击进入场景二' },
              },
            ],
          },
        },
      },
      demo2: {
        title: '场景二',
        source: '/demo2.splat',
        initialView: { yaw: 90, pitch: 0, fov: 60 },
        extensions: {
          hotspot: {
            hotspots: [
              {
                id: 'hotspot-back-1',
                type: 'scene',
                position: [1.0, 1.5, -2.0],
                targetScene: 'demo1',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#80ff80', size: 36 },
                onHover: { tooltip: '返回场景一' },
              },
              {
                id: 'hotspot-to-demo3',
                type: 'scene',
                position: [-1.5, 1.0, -1.5],
                targetScene: 'demo3',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#ffa080', size: 36 },
                onHover: { tooltip: '进入场景三' },
              },
            ],
          },
        },
      },
      demo3: {
        title: '场景三',
        source: '/demo3.splat',
        initialView: { yaw: 0, pitch: 0, fov: 60 },
        extensions: {
          hotspot: {
            hotspots: [
              {
                id: 'hotspot-back-2',
                type: 'scene',
                position: [1.0, 1.0, -2.0],
                targetScene: 'demo2',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#80ff80', size: 36 },
                onHover: { tooltip: '返回场景二' },
              },
              {
                id: 'hotspot-to-kitchen',
                type: 'scene',
                position: [-1.5, 1.0, -1.5],
                targetScene: 'kitchen',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#a080ff', size: 36 },
                onHover: { tooltip: '进入场景四' },
              },
              {
                id: 'hotspot-info-3',
                type: 'text',
                position: [0.3, 0.8, -1.0],
                onHover: { tooltip: `${sceneData.demo3.splatCount} splats · ${sceneData.demo3.sourceType}` },
              },
            ],
          },
        },
      },
      kitchen: {
        title: '场景四',
        source: '/kitchen.splat',
        initialView: { yaw: 0, pitch: 0, fov: 60 },
        extensions: {
          hotspot: {
            hotspots: [
              {
                id: 'hotspot-back-3',
                type: 'scene',
                position: [1.0, 1.0, -2.0],
                targetScene: 'demo3',
                transition: { type: 'fade', duration: 600 },
                style: { glow: true, pulse: true, color: '#80ff80', size: 36 },
                onHover: { tooltip: '返回场景三' },
              },
              {
                id: 'hotspot-info-4',
                type: 'text',
                position: [0.3, 0.8, -1.0],
                onHover: { tooltip: `${sceneData.kitchen.splatCount} splats · ${sceneData.kitchen.sourceType}` },
              },
            ],
          },
        },
      },
    },
  };

  // ── Shader 效果定义 ──
  const shaderEffects = {
    'color-cool': {
      id: 'color-cool',
      hook: ShaderHookPoint.FRAGMENT_BEFORE_OUTPUT,
      code: 'fragColor.rgb = vec3(fragColor.r * 0.8, fragColor.g * 0.9, fragColor.b * 1.2);'
    },
    'color-warm': {
      id: 'color-warm',
      hook: ShaderHookPoint.FRAGMENT_BEFORE_OUTPUT,
      code: 'fragColor.rgb = vec3(fragColor.r * 1.2, fragColor.g * 1.0, fragColor.b * 0.7);'
    },
    'grayscale': {
      id: 'grayscale',
      hook: ShaderHookPoint.FRAGMENT_BEFORE_OUTPUT,
      code: 'float gray = dot(fragColor.rgb, vec3(0.299, 0.587, 0.114)); fragColor.rgb = vec3(gray);'
    },
    'pulse': {
      id: 'pulse',
      hook: ShaderHookPoint.FRAGMENT_BEFORE_OUTPUT,
      uniforms: { uTime: 0.0 },
      code: 'fragColor.rgb *= 0.75 + 0.25 * sin(uTime * 2.0);',
      onUpdate: (u, dt) => { u.uTime.value += dt / 1000; },
    },
    'vignette': {
      id: 'vignette',
      hook: ShaderHookPoint.FRAGMENT_BEFORE_OUTPUT,
      uniforms: { uIntensity: 0.5, uResolution: [1920.0, 1080.0] },
      code: 'vec2 uv = gl_FragCoord.xy / uResolution; float dist = distance(uv, vec2(0.5)); fragColor.rgb *= 1.0 - dist * uIntensity;',
      onUpdate: (u) => {
        const size = renderer.getSize();
        u.uResolution.value = [size.width, size.height];
      },
    },
  };
  const activeShaderEffects = new Set();

  function toggleShaderEffect(effectId, enabled) {
    const effect = shaderEffects[effectId];
    if (!effect) return;
    if (enabled) {
      if (activeShaderEffects.has(effectId)) return;
      activeShaderEffects.add(effectId);
      renderer.addShaderInjection({ ...effect });
    } else {
      if (!activeShaderEffects.has(effectId)) return;
      activeShaderEffects.delete(effectId);
      renderer.removeShaderInjection(effectId);
    }
  }

  // ── HUD: 设备信息 + FPS + WebGPU 状态 ──
  const tier = renderer.getDeviceTier();
  const tierNames = ['LOW', 'MEDIUM', 'HIGH', 'ULTRA'];
  let fps = 0;
  let frameCount = 0;
  let fpsTimer = performance.now();

  player.on('load', () => {
    loading.style.display = 'none';
    hudEl.style.display = 'block';
    showInfo('拖拽旋转 / 滚轮前进后退 / WASD移动 / 双指缩放 / 点击热点跳转');

    // 显示格式切换面板
    const formatPanel = document.getElementById('format-panel');
    const formatToggles = document.getElementById('format-toggles');
    if (formatPanel && formatToggles) {
      formatPanel.style.display = 'block';
      formatToggles.innerHTML = '';
      const formatLabels = {
        splat: '📦 Splat',
        spz: '🗜️ SPZ',
        sog: '🌊 SOG',
      };
      for (const [fmt, label] of Object.entries(formatLabels)) {
        const scene = sceneData[currentSceneId];
        const row = document.createElement('div');
        row.className = 'format-toggle-row' + (fmt === currentFormat ? ' active' : '');
        row.innerHTML = `<span class="format-label">${label}<br><span class="format-size">${scene.formats[fmt].size}</span></span><span class="format-toggle-switch"></span>`;
        row.onclick = async () => {
          if (isSwitching || fmt === currentFormat) return;
          row.classList.add('active');
          document.querySelectorAll('.format-toggle-row').forEach(r => {
            if (r !== row) r.classList.remove('active');
          });
          await switchFormat(fmt);
        };
        formatToggles.appendChild(row);
      }
    }

    // 显示 Shader 面板
    const shaderPanel = document.getElementById('shader-panel');
    const shaderToggles = document.getElementById('shader-toggles');
    const shaderClearBtn = document.getElementById('shader-clear-btn');
    if (shaderPanel && shaderToggles) {
      shaderPanel.style.display = 'block';
      const effectLabels = {
        'color-cool': '❄️ 冷色调',
        'color-warm': '🔥 暖色调',
        'grayscale': '⚫ 灰度模式',
        'pulse': '✨ 脉冲动画',
        'vignette': '🔍 暗角效果',
      };
      const shaderToggleRows = {};
      for (const [id, label] of Object.entries(effectLabels)) {
        const row = document.createElement('div');
        row.className = 'shader-toggle-row';
        row.innerHTML = `<span class="shader-label">${label}</span><span class="shader-toggle-switch"></span>`;
        row.onclick = () => {
          const enabled = !row.classList.contains('active');
          row.classList.toggle('active', enabled);
          toggleShaderEffect(id, enabled);
          shaderClearBtn.disabled = activeShaderEffects.size === 0;
        };
        shaderToggles.appendChild(row);
        shaderToggleRows[id] = row;
      }
      if (shaderClearBtn) {
        shaderClearBtn.onclick = () => {
          for (const id of Object.keys(effectLabels)) {
            if (activeShaderEffects.has(id)) {
              toggleShaderEffect(id, false);
              shaderToggleRows[id]?.classList.remove('active');
            }
          }
          shaderClearBtn.disabled = true;
        };
      }
    }
  });

  // FPS 监控 + 按键状态高亮 (挂载到渲染器帧回调)
  const keyEls = {
    w: document.getElementById('key-w'),
    a: document.getElementById('key-a'),
    s: document.getElementById('key-s'),
    d: document.getElementById('key-d'),
    q: document.getElementById('key-q'),
    e: document.getElementById('key-e'),
  };
  renderer.onFrame(() => {
    frameCount++;
    const now = performance.now();

    const activeKeys = renderer.getActiveMoveKeys ? renderer.getActiveMoveKeys() : [];
    for (const [k, el] of Object.entries(keyEls)) {
      if (el) el.classList.toggle('active', activeKeys.includes(k));
    }

    if (now - fpsTimer >= 500) {
      fps = Math.round((frameCount * 1000) / (now - fpsTimer));
      frameCount = 0;
      fpsTimer = now;
      const resScale = renderer.getResolutionScale ? renderer.getResolutionScale() : 1.0;
      const isolated = RenderManager.isCrossOriginIsolated() ? '✓' : '✗';
      const lodStatus = renderer.isLodReady ? (renderer.isLodReady() ? '✓' : '✗') : '—';
      const gpuInfo = webgpuCapability.adapterInfo
        ? `${webgpuCapability.adapterInfo.vendor} ${webgpuCapability.adapterInfo.architecture}`
        : 'N/A';
      const fmtInfo = sceneData[currentSceneId]?.formats[currentFormat];
      hudEl.innerHTML = [
        `Backend: ${backend.toUpperCase()} | Tier: ${tierNames[tier]} | FPS: ${fps}`,
        `GPU: ${gpuInfo}`,
        `Format: ${currentFormat.toUpperCase()} | Resolution: ${(resScale * 100).toFixed(0)}% | SAB: ${isolated} | LOD: ${lodStatus}`,
      ].join('<br>');
    }
  });

  // ── 事件 ──
  player.on('hotspot:click', (h) => {
    const d = h;
    showInfo(`点击热点: ${d?.id || '(热点)'}`);
  });

  player.on('hotspot:hover', (h) => {
    const d = h;
    if (d?.config?.onHover?.tooltip) {
      showInfo(d.config.onHover.tooltip);
    }
  });

  player.on('scene:switched', (data) => {
    const d = data;
    showInfo(`已切换到场景: ${d?.sceneId || ''}`);
    updateSelector(d?.sceneId);
    currentSceneId = d?.sceneId || currentSceneId;
    updateFormatPanel();
  });

  player.on('error', ({ message }) => {
    loading.style.display = 'none';
    errorEl.textContent = '❌ ' + message;
    errorEl.style.display = 'block';
  });

  function showInfo(text) {
    let el = document.getElementById('info');
    if (!el) {
      el = document.createElement('div');
      el.id = 'info';
      container.appendChild(el);
    }
    el.textContent = text;
  }

  function updateSelector(activeId) {
    selectorEl.innerHTML = '';
    for (const id of Object.keys(config.scenes)) {
      const btn = document.createElement('button');
      btn.textContent = config.scenes[id].title || id;
      btn.className = id === activeId ? 'active' : '';
      btn.onclick = async () => {
        if (isSwitching || id === activeId) return;
        await switchScene(id);
      };
      selectorEl.appendChild(btn);
    }
  }

  /**
   * 更新格式切换面板 (场景切换后更新文件大小信息)
   */
  function updateFormatPanel() {
    const formatToggles = document.getElementById('format-toggles');
    if (!formatToggles) return;
    const rows = formatToggles.querySelectorAll('.format-toggle-row');
    const formatKeys = ['splat', 'spz', 'sog'];
    rows.forEach((row, idx) => {
      const fmt = formatKeys[idx];
      if (!fmt) return;
      const scene = sceneData[currentSceneId];
      if (!scene) return;
      const sizeEl = row.querySelector('.format-size');
      if (sizeEl) sizeEl.textContent = scene.formats[fmt].size;
      row.classList.toggle('active', fmt === currentFormat);
    });
  }

  /**
   * ★ 场景切换 — 先更新配置中的 source/lodSource 为当前格式, 再调用 switchScene
   *
   * 优化项:
   *   - 避免二次加载: 动态修改 config 的 source 为当前格式的 URL
   *   - SOG 格式: 设置 lodSource 启用流式加载, source 设为 .splat 作为回退
   *   - 加载指示器: 显示加载状态, 防止用户在加载中重复操作
   */
  async function switchScene(sceneId) {
    if (isSwitching) return;
    isSwitching = true;
    loading.style.display = 'block';
    loadingText.textContent = `加载场景: ${config.scenes[sceneId]?.title || sceneId}...`;

    try {
      currentSceneId = sceneId;
      // 动态更新场景配置的 source 为当前格式
      applyFormatToConfig();

      await player.switchScene(sceneId);
      updateSelector(sceneId);
      updateFormatPanel();
    } catch (err) {
      console.error('场景切换失败:', err);
      errorEl.textContent = '❌ 场景切换失败: ' + (err instanceof Error ? err.message : String(err));
      errorEl.style.display = 'block';
    } finally {
      loading.style.display = 'none';
      isSwitching = false;
    }
  }

  /**
   * ★ 格式切换 — 直接调用 renderer.loadScene 加载不同格式的同一场景
   *
   * 优化项:
   *   - 不经过 player.switchScene, 避免热点重建和场景状态变更
   *   - SOG 格式: 传入 lodSource 启用流式 LOD, 首帧快速渲染
   *   - 加载指示器: 显示加载状态和进度
   *   - 防抖锁: isSwitching 防止重复操作
   *   - 渐进式加载: SOG 首个 chunk 到达即渲染, 后续逐步补全
   */
  async function switchFormat(format) {
    if (isSwitching) return;
    isSwitching = true;
    loading.style.display = 'block';
    const scene = sceneData[currentSceneId];
    loadingText.textContent = `加载 ${format.toUpperCase()} 格式 (${scene?.title || currentSceneId})...`;

    try {
      currentFormat = format;
      const fmtData = scene?.formats[format];
      if (!fmtData) throw new Error(`格式 ${format} 不可用`);

      const loadOptions = {
        onProgress: (loaded, total) => {
          if (total > 0) {
            const pct = Math.round((loaded / total) * 100);
            loadingText.textContent = `加载 ${format.toUpperCase()} 格式... ${pct}%`;
          }
        },
      };

      if (format === 'sog') {
        // SOG: 传入 lodSource 启用流式 LOD, source 设为 .splat 作为回退
        const splatUrl = scene.formats.splat.url;
        await renderer.loadScene(splatUrl, { ...loadOptions, lodSource: fmtData.url });
      } else {
        // Splat / SPZ: 直接加载 (Spark 从 URL 扩展名自动检测格式)
        await renderer.loadScene(fmtData.url, loadOptions);
      }

      showInfo(`格式切换: ${format.toUpperCase()} | ${scene?.title || currentSceneId} | ${fmtData.desc}`);
      updateFormatPanel();
    } catch (err) {
      console.error('格式切换失败:', err);
      errorEl.textContent = '❌ 格式切换失败: ' + (err instanceof Error ? err.message : String(err));
      errorEl.style.display = 'block';
      setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
    } finally {
      loading.style.display = 'none';
      isSwitching = false;
    }
  }

  /**
   * 将当前格式应用到 config 中的场景 source/lodSource
   * 在调用 player.switchScene 前调用, 避免二次加载
   */
  function applyFormatToConfig() {
    const scene = sceneData[currentSceneId];
    const sceneConfig = config.scenes[currentSceneId];
    if (!scene || !sceneConfig) return;

    const fmtData = scene.formats[currentFormat];
    if (!fmtData) return;

    if (currentFormat === 'sog') {
      // SOG: source 设为 .splat 作为回退, lodSource 设为 .sog
      sceneConfig.source = scene.formats.splat.url;
      sceneConfig.lodSource = fmtData.url;
    } else {
      // Splat / SPZ: 直接设为对应格式 URL
      sceneConfig.source = fmtData.url;
      sceneConfig.lodSource = undefined;
    }
  }

  // ── 加载 ──
  loadingText.textContent = '加载场景配置...';
  await player.load(config);

  // ── 切换到第一个场景 ──
  loadingText.textContent = '加载 3DGS 数据...';
  await player.switchScene('demo1');
}
main().catch((err) => {
  console.error(err);
  const errorEl = document.getElementById('error');
  const loading = document.getElementById('loading');
  loading.style.display = 'none';
  errorEl.textContent = '❌ ' + (err instanceof Error ? err.message : String(err));
  errorEl.style.display = 'block';
});
</script>
</body>
</html>
